name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "cmd/reduce-pdf-size-wasm/**"
      - "pkg/pdf/**"
      - "web/**"
      - ".github/workflows/pages.yml"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build wasm
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o web/reduce-pdf-size.wasm ./cmd/reduce-pdf-size-wasm

      - name: Copy wasm_exec.js
        run: |
          GOROOT="$(go env GOROOT)"
          for candidate in "$GOROOT/lib/wasm/wasm_exec.js" "$GOROOT/misc/wasm/wasm_exec.js"; do
            if [ -f "$candidate" ]; then
              cp "$candidate" web/wasm_exec.js
              exit 0
            fi
          done
          echo "wasm_exec.js not found under $GOROOT" >&2
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
